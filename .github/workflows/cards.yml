name: Refresh cards

# Regenerates assets/cards/*.svg (activity, languages, recently active repos) from the
# GitHub API once a day. The SVGs contain no timestamp, so a run with nothing new makes
# no commit.
#
# Optional: add a repository secret PROFILE_TOKEN (a classic token with `read:user`) so the
# contribution count includes private contributions, matching your profile page. Without
# it the default Actions token is used and only public activity is counted.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-cards.mjs"
      - "scripts/lib/**"

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build cards
        run: node scripts/build-cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          if git diff --cached --quiet; then
            echo "Cards are up to date."
          else
            git commit -m "chore: refresh cards"
            git pull --rebase origin main
            git push
          fi
