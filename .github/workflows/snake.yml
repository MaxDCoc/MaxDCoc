name: Contribution snake

# Draws the contribution graph as an animated snake (Platane/snk) in the locker orange,
# one SVG per theme, and commits them to assets/snake/. The README reads them through a
# relative path like every other image, so they also load while the repo is private.
# A run that finds nothing new makes no commit.

on:
  schedule:
    - cron: "43 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=%23edeef1&color_dots=%2321262d,%23553012,%23954f10,%23e07416,%23ff9b45
            dist/snake-light.svg?color_snake=%230e1014&color_dots=%23e1e4e8,%23ffd9b3,%23ffb066,%23ff8719,%23b04a00

      - name: Commit if anything changed
        run: |
          mkdir -p assets/snake
          cp dist/snake-dark.svg dist/snake-light.svg assets/snake/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake
          if git diff --cached --quiet; then
            echo "Snake is up to date."
          else
            git commit -m "chore: refresh snake"
            git pull --rebase origin main
            git push
          fi
